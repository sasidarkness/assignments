<!DOCTYPE html>
<html>
<head>
    <title>Save Object in LocalStorage</title>
</head>
<body>

<h2>Save Object as JSON in localStorage</h2>
<p id="output"></p>

<script>
    
    const user = {
        name: "Sasi",
        course: "BCA",
        age: 22
    };

   
    const jsonData = JSON.stringify(user);

    
    localStorage.setItem("userData", jsonData);

   
    const savedData = JSON.parse(localStorage.getItem("userData"));

   
    document.getElementById("output").innerText =
        "Name: " + savedData.name +
        ", Course: " + savedData.course +
        ", Age: " + savedData.age;
</script>

</body>
</html>
