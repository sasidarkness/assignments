<!DOCTYPE html>
<html>
<head>
    <title>Show & Save Location</title>
</head>
<body>

<h2>Your Current Location</h2>

<button onclick="getLocation()">Get My Location</button>
<button onclick="saveLocation()">Save Location</button>

<p id="output"></p>
<p id="saved"></p>

<script>
let currentLatitude = null;
let currentLongitude = null;

function getLocation() {
    const output = document.getElementById("output");

    if (!navigator.geolocation) {
        output.innerHTML = "Geolocation is not supported by your browser.";
        return;
    }

    navigator.geolocation.getCurrentPosition(success, error);
}

function success(position) {
    currentLatitude = position.coords.latitude;
    currentLongitude = position.coords.longitude;

    document.getElementById("output").innerHTML =
        `Latitude: ${currentLatitude} <br> Longitude: ${currentLongitude}`;
}

function error() {
    document.getElementById("output").innerHTML =
        "Unable to retrieve your location. Please allow location access.";
}

function saveLocation() {
    if (currentLatitude && currentLongitude) {
        const locationObj = {
            latitude: currentLatitude,
            longitude: currentLongitude
        };

        localStorage.setItem("myLocation", JSON.stringify(locationObj));
        document.getElementById("saved").innerHTML =
            "Location saved in localStorage!";
    } else {
        document.getElementById("saved").innerHTML =
            "Get the location first before saving!";
    }
}


window.onload = () => {
    const saved = localStorage.getItem("myLocation");
    if (saved) {
        const loc = JSON.parse(saved);
        document.getElementById("saved").innerHTML =
            `Saved Location → Latitude: ${loc.latitude}, Longitude: ${loc.longitude}`;
    }
};
</script>

</body>
</html>
