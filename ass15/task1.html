<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Simple Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh;
      background: #f0f4f8;
    }
    h1 { color: #333; }
    p { color: #555; }
    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #0078d7;
      color: white;
      border: none;
      border-radius: 5px;
      text-decoration: none;
    }
    .btn:hover { background: #005a9e; }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <p>This is a super simple page you can host anywhere.</p>
  <a href="https://example.com" class="btn">Learn More</a>
</body>
</html>
